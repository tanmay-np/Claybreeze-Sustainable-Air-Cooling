<!doctype html>
<!--
  Renders the Circuit & Control Lab drawing (light theme, no animation) with the same code as
  the website (assets/js/circuit-lab.js), for the report and the poster:
    tools/circuit-figure.html?t=31&rh=55   (see tools/render-circuit-figure.py)
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>ClayBreeze circuit figure</title>
  <link rel="stylesheet" href="../assets/css/site.css">
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; }
    .circuit-svg { border: 0; padding: 0; background: #ffffff; width: 1040px; }
    .cl-svg { max-width: none; width: 1040px; }
    .hidden-ui { display: none; }
  </style>
</head>
<body>
  <div class="circuit-svg" id="circuit-svg"></div>
  <div class="hidden-ui">
    <input type="range" id="sim-temp-slider" min="15" max="45" step="0.5" value="25"><input type="number" id="sim-temp-number">
    <input type="range" id="sim-rh-slider" min="30" max="90" step="1" value="50"><input type="number" id="sim-rh-number">
    <div id="sim-fan-outputs"></div><div id="sim-pump-outputs"></div><table id="sim-fan-table"></table><table id="sim-pump-table"></table>
    <p id="sim-fan-explain"></p><p id="sim-pump-explain"></p><p id="sim-readout"></p><span id="sim-rule-note"></span><p id="circuit-wire-info"></p>
  </div>
  <script src="../assets/js/project-data.js"></script>
  <script>history.replaceState(null, "", location.pathname + location.search + (location.search ? "&" : "?") + "reducedmotion");</script>
  <script src="../assets/js/circuit-lab.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const set = (id, v) => { const s = document.getElementById(id); s.value = v; s.dispatchEvent(new Event("input")); };
    set("sim-temp-slider", q.get("t") || "31");
    set("sim-rh-slider", q.get("rh") || "55");
  </script>
</body>
</html>
